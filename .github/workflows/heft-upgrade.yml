name: Finalize Heft repository cleanup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Remove generated packaging copies and prevent recurrence
        run: |
          git rm -r --ignore-unmatch projects/m365-profile-cards/sharepoint/solution/debug
          python3 - <<'PY'
          import pathlib
          file = pathlib.Path('projects/m365-profile-cards/.gitignore')
          content = file.read_text()
          for pattern in ['sharepoint/solution/debug/', 'lib-dts/', 'lib-esm/']:
              if pattern not in content.splitlines():
                  content += '\n' + pattern + '\n'
          file.write_text(content)
          PY
      - run: python3 scripts/package-source.py
        working-directory: projects/m365-profile-cards
      - run: npm run build && npm run check
        working-directory: portfolio
      - name: Commit source-only cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/m365-profile-cards/.gitignore portfolio/projects/m365-profile-cards/downloads/source.zip
          git commit -m 'Exclude generated SPFx packaging copies from source'
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: portfolio/dist
  deploy:
    needs: cleanup
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
