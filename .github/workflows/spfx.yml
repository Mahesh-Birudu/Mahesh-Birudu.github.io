name: SPFx Heft checks
on:
  push:
    branches: [main]
    paths: ['projects/**', 'webparts/**', '.github/workflows/spfx.yml']
  pull_request:
    paths: ['projects/**', 'webparts/**', '.github/workflows/spfx.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        project: [projects/m365-profile-cards, projects/m365-search-filters, projects/m365-search-verticals, projects/m365-extensions, projects/m365-column-splitter, webparts/carousel]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
      - run: npm ci --no-fund --no-audit --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run package
