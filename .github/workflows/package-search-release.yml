name: Validate and release filters fix
on:
  push:
    paths: ['.github/workflows/package-search-release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
      - name: Restore reviewed clear fix
        run: |
          python3 - <<'PY'
          import json,gzip,base64,pathlib
          for name,content in json.loads(gzip.decompress(base64.b64decode(''))).items():
              assert name.startswith('projects/m365-search-filters/') and '..' not in pathlib.Path(name).parts
              p=pathlib.Path(name)
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(content)
          PY
      - name: Validate and package
        working-directory: projects/m365-search-filters
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          npm run package
      - name: Publish fix and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/m365-search-filters
          git commit -m "Fix named PnP clear events for global reset"
          git push
          gh release create search-filters-v1.0.1 --target main --title "Search Filters 1.0.1" --notes "Fix Clear all using PnP named-field clear events. Twelve behavior tests, TypeScript, Heft production build and packaging passed." projects/m365-search-filters/sharepoint/solution/m365-search-filters.sppkg
