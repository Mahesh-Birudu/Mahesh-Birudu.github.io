      - name: Check and package both projects
        run: |
          for project in m365-profile-cards m365-search-filters; do
            cd "$GITHUB_WORKSPACE/projects/$project"
            npm ci --no-audit --no-fund
            npm run typecheck
            npm test
            npm run build
            npm run package
            npm run preview:build
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: branded-search-packages
          path: |
            projects/*/sharepoint/solution/*.sppkg
            projects/m365-search-filters/preview/dist/
      - name: Publish validated source and remove completed staging workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/stage-search-filters.yml
          git add projects/m365-profile-cards projects/m365-search-filters projects/m365-search-brand README.md .github/workflows/spfx.yml .github/workflows/stage-search-filters.yml
          git commit -m "Add branded React search filters and shared search theme"
          git push
