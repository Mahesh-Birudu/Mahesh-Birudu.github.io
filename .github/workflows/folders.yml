name: Organize named project folders
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  organize:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Mahesh-Birudu/m365-profile-cards
          ref: d64157f9893601bf9db8597216f784de165e5d4c
          path: _m365_source
          persist-credentials: false
      - run: python3 reorganize.py _m365_source
      - run: npm run build && npm run check
        working-directory: portfolio
      - name: Commit validated folder structure
        run: |
          python3 - <<'PY'
          import pathlib, shutil
          root = pathlib.Path.cwd().resolve()
          target = (root / '_m365_source').resolve()
          if target.parent != root or target.name != '_m365_source':
              raise SystemExit('Invalid temporary source path')
          shutil.rmtree(target)
          (root / 'reorganize.py').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Group website and SPFx source into named project folders'
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: portfolio/dist
  deploy:
    needs: organize
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
