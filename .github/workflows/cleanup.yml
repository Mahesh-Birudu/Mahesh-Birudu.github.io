name: Apply reviewed portfolio cleanup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Apply reviewed source archive and remove superseded copies
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, shutil
          root = pathlib.Path.cwd().resolve()
          archive = root / 'portfolio-cleanup.zip'
          if not archive.is_file():
              raise SystemExit('Reviewed cleanup archive missing; migration already applied or not staged')
          allowed = {'src', 'public', 'scripts', '.gitignore', '.gitattributes', 'package.json', 'README.md', 'SECURITY.md'}
          old = ['portfolio', 'projects', 'ICONS-LICENSES.md', 'M365-PROFILE-CARDS.md', 'Maheshbabu_SharePoint_CV.docx', 'PORTFOLIO-MAINTENANCE.md', 'index.html', 'm365-profile-cards-source.zip', 'm365-profile-cards.html', 'm365-profile-cards.sppkg', 'mahesh-portrait.png', 'portfolio-v2.css', 'portfolio-v2.js', 'portfolio.js', 'profile-cards-demo-poster.png', 'profile-cards-demo.html', 'profile-cards-demo.js', 'profile-cards-demo.mp4', 'profile-cards-demo.vtt', 'profile-cards.html', 'project-detail.css', 'projects.js', 'style.css']
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  p = pathlib.PurePosixPath(info.filename)
                  if p.is_absolute() or '..' in p.parts or not p.parts or p.parts[0] not in allowed or '\\' in info.filename or ((info.external_attr >> 16) & 0o170000) == 0o120000:
                      raise SystemExit('Unexpected archive entry: ' + info.filename)
              for name in old:
                  target = (root / name).resolve()
                  if target.parent != root:
                      raise SystemExit('Invalid cleanup target')
                  if target.is_dir():
                      shutil.rmtree(target)
                  elif target.exists():
                      target.unlink()
              z.extractall(root)
          archive.unlink()
          PY
      - run: npm run build
      - run: npm run check
      - name: Commit verified source reorganization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean portfolio source and separate M365 project'
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: clean
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment

